[package]
name = "bootleg-toolbox"
version = "0.1.9"
edition = "2021"
rust-version = "1.89"
# Distributed as executables, not on crates.io.
publish = false
authors = ["Rattlehead80"]
license = "GPL-3.0-or-later"
description = "Checksums, tests, torrents and conversions for lossless concert recordings - a modern take on Trader's Little Helper"
repository = "https://github.com/bootleg-toolbox-group/bootleg-toolbox"

[dependencies]
# Same winit as eframe, with its default features (eframe's own defaults are off): picks the
# X11 backend on Linux (drag and drop).
winit = "0.30"
# Without egui's default fonts (Ubuntu and Hack are not under OSI-approved licences): see fonts.rs.
eframe = { version = "0.29", default-features = false, features = ["accesskit", "glow", "wayland", "x11", "persistence"] }
egui_extras = "0.29"
symphonia = { version = "0.5", default-features = false, features = ["flac", "wav", "pcm", "mp2", "mp3", "aac", "alac", "vorbis", "isomp4", "mkv"] }
md-5 = "0.11"
crc32fast = "1"
sha1 = "0.11"
rayon = "1.10"
regex = "1"
rfd = "0.17"
trash = "5"
open = "5"
serde = { version = "1", features = ["derive"] }
# setlist.fm answers (JSON), only when the user asks for a setlist.
serde_json = "1"
# Undo journal of Tag and rename (already used by eframe for its settings).
ron = "0.8"
# Spectrogram legend (egui's own font) and PNG export; both already used by eframe.
ab_glyph = "0.2"
png = "0.18"
# Same clipboard crate as egui, with images (spectrogram "Copy").
arboard = { version = "3.3", default-features = false, features = ["image-data"] }
# FLAC encoder in pure Rust (Apache-2.0); files are encoded in parallel, not frames.
flacenc = { version = "0.5", default-features = false }
# Monkey's Audio (APE) decoder in pure Rust (MIT OR Apache-2.0), versions 3.95 and later.
ape-decoder = "0.3.2"
# WavPack (lossless, mono/stereo, 16-32-bit and float) decoder in pure Rust (MIT OR Apache-2.0).
wavicle = "0.1.0"
# MP3 encoding: LAME 3.100 (C, LGPL-3.0), built from source into the executable.
mp3lame-encoder = "0.2.5"
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Same zbus as rfd, to read the desktop's light/dark preference (XDG portal).
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# md-5 is used under its library name, md5.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1"

# ape-decoder with Monkey's Audio 3.95-3.98 support (older value coding), see vendor/ape-decoder.
[patch.crates-io]
ape-decoder = { path = "vendor/ape-decoder" }

[dev-dependencies]
# Property tests (tests/properties.rs), snapshot tests (tests/snapshots.rs).
proptest = "1"
insta = "1"
tempfile = "3"
