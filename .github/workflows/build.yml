# Tests and builds the Linux and Windows executables.
# - On every push to main and by hand (Actions > Build > Run workflow): the executables
#   are kept as downloadable artifacts of the run for 14 days.
# - On a version tag (v0.1.0...): a Release is created with both executables and their
#   SHA-256 checksums, and a signed build provenance attestation for each executable
#   (anyone can check it with: gh attestation verify <file> --repo bootleg-toolbox-group/bootleg-toolbox).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The oldest supported Ubuntu: the Linux executable then runs on older systems too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64
          rustup update stable
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          cargo install --locked cargo-auditable@0.7.7

      # Downloaded crates and compiled dependencies, reused while Cargo.lock does not change.
      # Not for releases: the published executables are always built from scratch.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0 # zizmor: ignore[cache-poisoning] skipped for releases
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Tests
        run: cargo test --release

      - name: Version check
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)" >&2
            exit 1
          fi

      - name: Executables
        run: |
          ./build-dist.sh
          mkdir -p out
          cp dist/bootleg-toolbox out/bootleg-toolbox-linux-x86_64
          cp dist/bootleg-toolbox.exe out/bootleg-toolbox-windows-x86_64.exe
          cd out
          sha256sum bootleg-toolbox-linux-x86_64 bootleg-toolbox-windows-x86_64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootleg-toolbox-${{ github.sha }}
          path: out/
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootleg-toolbox-${{ github.sha }}
          path: out

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/bootleg-toolbox-linux-x86_64
            out/bootleg-toolbox-windows-x86_64.exe

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Bootleg Toolbox ${GITHUB_REF_NAME#v}" \
            --notes "Windows: download bootleg-toolbox-windows-x86_64.exe and run it.
          Linux: download bootleg-toolbox-linux-x86_64, make it executable (chmod +x) and run it; Help > Add to the applications menu adds it to your menu.
          SHA256SUMS.txt lists the checksums of both files.
          Windows code signing: free code signing provided by SignPath.io, certificate by SignPath Foundation (application in progress; this release is not signed yet).
          Code signing policy: https://github.com/${GITHUB_REPOSITORY}#code-signing-policy"
