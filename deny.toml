# cargo-deny: checked on every push (see .github/workflows/checks.yml).
# - advisories: known vulnerabilities and unmaintained crates (RustSec database);
# - licenses: only OSI-approved licences compatible with GPL-3.0-or-later;
# - sources: crates from crates.io only (plus the patched copy in vendor/).

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu"]

[advisories]
version = 2
yanked = "deny"
# All of them come with eframe/egui 0.29 (pinned on purpose) and have no fix without
# upgrading egui. To look at again when egui is upgraded.
ignore = [
    # quick-xml 0.30 (zbus_xml, accessibility on Linux): only parses local D-Bus
    # interface descriptions, never a file given to the program.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via egui accessibility; local D-Bus XML only" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via egui accessibility; local D-Bus XML only" },
    # Unmaintained, no known vulnerability.
    { id = "RUSTSEC-2024-0436", reason = "paste: build-time macro of accesskit_windows" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: reads the fonts built into the program only" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 4: older zbus pulled by egui accessibility" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 3: older zbus pulled by egui accessibility" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 4: older zbus pulled by egui accessibility" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-3.0",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
